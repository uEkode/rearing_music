<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>牧音管家 · 演示版</title>
<!-- 样式分层：令牌 → 基础 → 组件；android.css 必须最后（覆盖桌面手机壳样式） -->
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<style id="__dm_no_drag_style__">* { -webkit-user-drag: none !important; }</style><style id="__dm_bindable_badge_style__">[data-sp-bindable="database"]{outline:1px dashed #0088ff;outline-offset:2px;border-radius:4px;}[data-sp-bindable="database"] *{pointer-events:none !important;transition:none !important;animation:none !important;}[data-sp-bindable="database"]{transition:none !important;animation:none !important;}</style>
<link rel="stylesheet" href="css/android.css">
</head>
<body>
<div class="wrap">
  <div class="phone">
    <div class="screen"><div class="demo-strip"><span>牧音管家 · 演示数据 / 未接设备</span><button type="button" id="resetDemo">重置演示</button></div>
      <div class="statusbar"><span class="sb-time">9:41</span>
        <span class="sb-icons">
          <svg class="sb-signal" viewBox="0 0 18 12" fill="currentColor" aria-hidden="true">
            <rect x="0"  y="7.5" width="3" height="4"   rx="1"/>
            <rect x="5"  y="5"   width="3" height="6.5" rx="1"/>
            <rect x="10" y="2.5" width="3" height="9"   rx="1"/>
            <rect x="15" y="0"   width="3" height="11.5" rx="1"/>
          </svg>
          <svg class="sb-wifi" viewBox="0 0 16 12" fill="none" stroke="currentColor"
            stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
            <path d="M1.2 4.1a10.4 10.4 0 0 1 13.6 0"/>
            <path d="M3.9 7.1a6.6 6.6 0 0 1 8.2 0"/>
            <path d="M6.4 9.9a3 3 0 0 1 3.2 0"/>
            <circle cx="8" cy="11.1" r=".9" fill="currentColor" stroke="none"/>
          </svg>
          <span class="sb-batt"><span class="sb-batt-fill"></span></span>
        </span>
      </div>
      <!-- 页面内容全部由 js/views 渲染，这里只留挂载点 -->
      <div class="scroll" id="scroll"></div>
      <div id="mini"></div>
      <div class="nav" id="nav"></div>
      <div class="sheet" id="sheet"><div class="panel" id="sheetPanel"></div></div>
      <div class="toast" id="toast"></div>
    </div>
  </div>

</div>

<!-- 脚本按依赖顺序加载：状态 → 数据 → 工具 → 播放器 → 页面 → 弹层 → 骨架 → 交互 → 启动 -->
<script src="js/state.js"></script>
<script src="js/data.js"></script>
<script src="js/ui.js"></script>
<script src="js/player.js"></script>
<script src="js/views/home.js"></script>
<script src="js/views/music.js"></script>
<script src="js/views/events.js"></script>
<script src="js/views/me.js"></script>
<script src="js/sheets.js"></script>
<script src="js/app.js"></script>
<script src="js/actions.js"></script>
<script src="js/slider.js"></script>
<script src="js/main.js"></script>


</body></html>
